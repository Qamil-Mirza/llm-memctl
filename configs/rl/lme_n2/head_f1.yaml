# N2 (Experiment 15): a query-aware floor head. Memory keeps nothing but the current turn (keep_none); at each
# question the head picks 5 of the 16 BM25 candidates to retrieve (floor_head). Trained by imitation with a
# listwise loss on the gold evidence of each question, on composed 4-question episodes from the train part of
# fold 1. Removal decisions do not arise (keep_none), so the head is the only thing learned.
schema_version: 1
name: lme_head_f1
seed: 0
env: {name: longmemeval, path: data/longmemeval/longmemeval_s_cleaned.json, folds: {k: 5, fold: 1, part: train}, compose: 4}
agent: {name: "null"}
controller: {name: rl, hidden: 64, architecture: deepsets, retrieval_method: lexical, retrieve_floor: 5,
             retrieve_candidates: 16, floor_head: true, keep_none: true}
memory:
  allowed_operations: [KEEP, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
  embedder: hashing
  count_labels: true
training:
  budget_fractions: [0.0125]
  expert: {kind: regret, retrieval_risk: 0.36}
  phases:
    - {algorithm: bc, iterations: 10, episodes: 25, epochs: 4, lr: 0.003, dagger: true, retrieval_loss: listwise}
  eval: {every: 2, episodes: 5, metric: evidence}
