# D5 plug-in rule: a calibrated P(needed again | removed item) for the D1 regret policy, seed 1.
schema_version: 1
name: needed_v_s1
seed: 1
env: {name: synthetic_recall, horizon: 200}
agent: {name: scripted_reader, noise: 0.0}
controller: {name: rl, checkpoint: runs/rl_bc_archive_regret_s1/checkpoints/policy.pt}
memory:
  allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
  embedder: hashing
needed:
  episodes: 200
  held_out: 50
  budget_fractions: [0.02, 0.05, 0.1, 0.25]
  output: runs/needed_v_s1
