# RL only, immediate reward: PPO with gamma 0, so a decision is credited only with the reward
# of its own step. The comparison with rl_ppo is hypothesis H2.
schema_version: 1
name: rl_ppo_gamma0
seed: 0
env: {name: synthetic_recall, horizon: 200}
agent: {name: scripted_reader, noise: 0.0}
controller: {name: rl, hidden: 64, architecture: deepsets}
memory:
  allowed_operations: [KEEP, EVICT, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.05, 0.1, 0.25, 0.5]
  phases:
    - {algorithm: ppo, iterations: 100, episodes: 24, epochs: 4, lr: 0.0003, gamma: 0.0, entropy: 0.01}
  eval: {every: 5, episodes: 20}
