# GRPO variants from the follow-the-clue imitation policy (runs/rl_bc_bridge_regret_s1), 1,440 GRPO
# episodes each so variants are compared at matched experience. Plain GRPO (group std), 24 episodes x 60 iterations.
schema_version: 1
name: grpo_std_s1
seed: 1
env: {name: synthetic_recall, horizon: 200}
agent: {name: scripted_reader, noise: 0.0}
controller: {name: rl, hidden: 64, architecture: deepsets, retrieve_candidates: 8, bridge_search: true,
             checkpoint: runs/rl_bc_bridge_regret_s1/checkpoints/policy.pt}
memory:
  allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.02, 0.05, 0.1, 0.25]
  expert: {kind: regret}
  phases:
  - {algorithm: grpo, group: 8, episodes: 24, iterations: 60, epochs: 4, lr: 0.0003, entropy: 0.01}
  eval: {every: 6, episodes: 20}
