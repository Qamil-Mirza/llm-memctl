# Archive and retrieval allowed: imitation of the hindsight expert, then PPO on task reward.
# The expert deletes what hindsight says is never needed. A learner cannot see that, so pure
# imitation deletes needed items; the PPO phase tests whether reward corrects it.
schema_version: 1
name: rl_bc_ppo_archive
seed: 0
env: {name: synthetic_recall, horizon: 200}
agent: {name: scripted_reader, noise: 0.0}
controller: {name: rl, hidden: 64, architecture: deepsets, retrieve_candidates: 8}
memory:
  allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.02, 0.05, 0.1, 0.25]
  phases:
    - {algorithm: bc, iterations: 6, episodes: 24, epochs: 3, lr: 0.003, dagger: true}
    - {algorithm: ppo, iterations: 60, episodes: 24, epochs: 4, lr: 0.0003, gamma: 0.995, entropy: 0.01}
  eval: {every: 3, episodes: 20}
