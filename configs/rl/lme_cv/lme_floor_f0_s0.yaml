# Cross-fitted regret imitation on LongMemEval-S (peer review T1/N2): trained on the train part of stratified
# fold 0 of 5 (env.folds), evaluated on its test part. Retrieval floor of 5 (BM25, the shared LME
# search; speaker/date labels lower BM25 recall on LongMemEval, Experiment 12), the head decides on ranks 6-16; no EVICT for the policy or the teacher; selection on evidence in view.
schema_version: 1
name: lme_floor_f0_s0
seed: 0
env: {name: longmemeval, path: data/longmemeval/longmemeval_s_cleaned.json, folds: {k: 5, fold: 0, part: train}}
agent: {name: "null"}
controller: {name: rl, hidden: 64, architecture: deepsets, retrieval_method: lexical, retrieve_floor: 5,
             retrieve_candidates: 16}
memory:
  allowed_operations: [KEEP, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.01, 0.02, 0.05]
  # retrieval_risk = 1 - BM25 share-found@5 on LongMemEval (0.644, Experiment 12): the chance the floor does not
  # bring an archived needed item back. Without it every archive ties at regret 0 and the loss is 0.
  expert: {kind: regret, retrieval_risk: 0.36}
  phases:
    - {algorithm: bc, iterations: 10, episodes: 40, epochs: 3, lr: 0.003, dagger: true}
  eval: {every: 2, episodes: 20, metric: evidence}
