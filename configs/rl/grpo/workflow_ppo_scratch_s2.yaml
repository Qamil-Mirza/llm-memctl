# GRPO experiment: PPO from scratch, workflow task (as rl_ppo_workflow). 1,584 training episodes (as rl_bc_ppo_archive), seed 2.
schema_version: 1
name: workflow_ppo_scratch_s2
seed: 2
env: {name: workflow}
agent: {name: scripted_tool_agent, noise: 0.0}
controller: {name: rl, hidden: 64, architecture: deepsets}
memory:
  allowed_operations: [KEEP, EVICT, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.05, 0.1, 0.2, 0.4]
  phases:
  - {algorithm: ppo, episodes: 24, epochs: 4, lr: 0.0003, gamma: 0.995, entropy: 0.01,
    iterations: 60}
  eval: {every: 6, episodes: 20}
