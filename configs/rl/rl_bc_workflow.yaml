# Imitation on the sequential workflow task (delete-only). Hindsight is only approximate here:
# once the learner forgets a token the episode diverges from the reference pass.
schema_version: 1
name: rl_bc_workflow
seed: 0
env: {name: workflow}
agent: {name: scripted_tool_agent, noise: 0.0}
controller: {name: rl, hidden: 64, architecture: deepsets}
memory:
  allowed_operations: [KEEP, EVICT, NO_OP]
  embedder: hashing
training:
  budget_fractions: [0.05, 0.1, 0.2, 0.4]
  phases:
    - {algorithm: bc, iterations: 10, episodes: 24, epochs: 3, lr: 0.003, dagger: true}
  eval: {every: 2, episodes: 20}
