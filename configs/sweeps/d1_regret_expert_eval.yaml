# D1: imitation of the oracle expert vs the regret expert (archive and retrieval allowed),
# three training seeds each, on the same evaluation seeds as Experiment 4b.
name: d1_regret_expert_eval
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: synthetic_recall, horizon: 200}
  agent: {name: scripted_reader, noise: 0.0}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 1}
grid:
  controller:
    - {name: fifo, label: fifo_delete}
    - {name: fifo, label: fifo_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: salience, label: salience_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: rl, label: bc_oracle_s0, checkpoint: runs/rl_bc_archive_oracle_s0/checkpoints/policy.pt}
    - {name: rl, label: bc_oracle_s1, checkpoint: runs/rl_bc_archive_oracle_s1/checkpoints/policy.pt}
    - {name: rl, label: bc_oracle_s2, checkpoint: runs/rl_bc_archive_oracle_s2/checkpoints/policy.pt}
    - {name: rl, label: bc_regret_s0, checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: bc_regret_s1, checkpoint: runs/rl_bc_archive_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: bc_regret_s2, checkpoint: runs/rl_bc_archive_regret_s2/checkpoints/policy.pt}
    - {name: oracle, method: approx}
  memory.budget.fraction: [0.02, 0.05, 0.1, 0.25]
