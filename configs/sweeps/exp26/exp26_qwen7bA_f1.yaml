# Experiment 26 (§26, pre-registered; NOT YET APPROVED for spend), phase 2, LongMemEval fold 1: arm A (OpenJev as memory
# manager) alone, replaying phase 1's stored answers only. If the hard stop cut arm A's phase 1, `episodes`
# is set at launch to the m questions every fold finished (the pre-declared prefix rule).
name: exp26_qwen7bA_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_exp26_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: jev
    base_url: JEV_URL
    model: openjev-latest
    timeout_s: 300
    retries: 5
    retrieve_candidates: 32
    cache_dir: cache/jev_exp26
    label: openjev_manage
    mode: manage
    call: pressure
    repair: true
    max_items_per_request: 40
    cache_only: true
  memory.budget.fraction:
  - 0.05
