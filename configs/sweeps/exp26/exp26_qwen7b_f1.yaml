# Experiment 26 (§26, pre-registered; NOT YET APPROVED for spend), phase 2, LongMemEval fold 1: the §23 Qwen 7B config with
# the cache directory changed and arm B (OpenJev as selector) beside FIFO + floor and fixed8 (rerun in the
# same session for pairing). Arm B replays phase 1's stored answers only (cache_only); its base_url is never
# called. POD_URL is the reader pod. Answers only (stub judge); one blind Qwen 7B judge pass follows.
name: exp26_qwen7b_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_exp26_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f1_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: jev
    base_url: JEV_URL
    model: openjev-latest
    timeout_s: 300
    retries: 5
    retrieve_candidates: 32
    cache_dir: cache/jev_exp26
    label: openjev_select
    mode: select
    select_k: 8
    cache_only: true
  memory.budget.fraction:
  - 0.05
