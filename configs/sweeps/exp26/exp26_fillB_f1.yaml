# Experiment 26 (§26, pre-registered; NOT YET APPROVED for spend), phase 1, LongMemEval fold 1: arm B (OpenJev as selector) alone against OpenJev's
# own pod (JEV_URL), stub reader. Every answer is stored in cache/jev_exp26 with its latency and server
# time; phase 2 replays them with the real reader.
name: exp26_fillB_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: stub
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: jev
    base_url: JEV_URL
    model: openjev-latest
    timeout_s: 300
    retries: 5
    retrieve_candidates: 32
    cache_dir: cache/jev_exp26
    label: openjev_select
    mode: select
    select_k: 8
  memory.budget.fraction:
  - 0.05
