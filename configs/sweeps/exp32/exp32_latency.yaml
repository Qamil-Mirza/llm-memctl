# Experiment 32 (§32): selection latency per question. Fold 0's test part, one worker, one thread, no score
# cache (the cross-encoder computes every pair). Run alone on an idle laptop.
name: exp32_latency
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 0
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: stub
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: rerank
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: head
  - name: rerank
    label: bm25_top8
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: bm25
  - name: rerank
    label: rrf_top8
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: rrf
      model: BAAI/bge-small-en-v1.5
  - name: rerank
    label: lr_pointwise
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: pointwise
      model: configs/sweeps/exp32/models/lr_f0.json
  - name: rerank
    label: gbdt_pointwise
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: pointwise
      model: configs/sweeps/exp32/models/gbdt_f0.pkl
  - name: rerank
    label: cross_encoder_zero
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: cross_encoder
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      cache: null
      cache_only: false
  - name: rerank
    label: cross_encoder_tuned
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    scorer:
      kind: cross_encoder
      model: runs/exp32_rerankers/ce_tuned_f0
      cache: null
      cache_only: false
  memory.budget.fraction:
  - 0.05
