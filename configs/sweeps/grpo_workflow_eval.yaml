# GRPO experiment, workflow task (delete-only): GRPO vs PPO from scratch. policy_best.pt.
name: grpo_workflow_eval
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: workflow}
  agent: {name: scripted_tool_agent, noise: 0.0}
  memory:
    allowed_operations: [KEEP, EVICT, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 0}
grid:
  controller:
    - fifo
    - {name: oracle, method: approx, eager: false, label: oracle_approx_lazy}
    - {name: rl, label: grpo_scratch_s0, checkpoint: runs/workflow_grpo_scratch_s0/checkpoints/policy_best.pt}
    - {name: rl, label: grpo_scratch_s1, checkpoint: runs/workflow_grpo_scratch_s1/checkpoints/policy_best.pt}
    - {name: rl, label: grpo_scratch_s2, checkpoint: runs/workflow_grpo_scratch_s2/checkpoints/policy_best.pt}
    - {name: rl, label: ppo_scratch_s0, checkpoint: runs/workflow_ppo_scratch_s0/checkpoints/policy_best.pt}
    - {name: rl, label: ppo_scratch_s1, checkpoint: runs/workflow_ppo_scratch_s1/checkpoints/policy_best.pt}
    - {name: rl, label: ppo_scratch_s2, checkpoint: runs/workflow_ppo_scratch_s2/checkpoints/policy_best.pt}
  memory.budget.fraction: [0.05, 0.1, 0.2, 0.4]
