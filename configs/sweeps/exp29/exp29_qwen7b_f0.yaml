# Experiment 29 (§29, pre-registered; NEEDS SPEND, not approved), reader qwen2.5-7b-instruct, LongMemEval fold 0.
# The §27 Qwen 7B config with five arms: FIFO + floor and fixed8 (the §19 head A, rerun for pairing), and the three
# §29 heads trained from cached rows on fold 0's TRAINING questions only (python -m memctl.reader_utility train).
# Answers only (stub judge); one blind Qwen 7B judge pass follows (judge_report.py).
name: exp29_qwen7b_f0
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 0
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_exp29_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: utility_head
    checkpoint: HEADS_DIR/f0/utility.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: blend_head
    checkpoint: HEADS_DIR/f0/blend.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: evidence_rows
    checkpoint: HEADS_DIR/f0/evidence.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  memory.budget.fraction:
  - 0.05
