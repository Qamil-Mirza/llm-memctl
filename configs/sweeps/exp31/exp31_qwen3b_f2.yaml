# Experiment 31 (§31, pre-registered; NEEDS SPEND, not approved): Qwen2.5-3B-Instruct served by memctl/ttt_server.py
# (HF transformers), LongMemEval fold 2. Two served names of one loaded model: "-hf" (no adaptation, the paired
# baseline) and "-hf-qttt" (query-only test-time training, 32 steps). Answers only (stub judge); one blind Qwen 7B
# judge pass follows. The controllers are §23's, unchanged.
name: exp31_qwen3b_f2
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 2
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f2_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  agent.model:
  - label: base
    backend: openai
    name: qwen2.5-3b-instruct-hf
    base_url: POD_URL/v1
    timeout_s: 3600
    cache_dir: cache/generations_exp31_qwen3b
  - label: qttt
    backend: openai
    name: qwen2.5-3b-instruct-hf-qttt
    base_url: POD_URL/v1
    timeout_s: 3600
    cache_dir: cache/generations_exp31_qwen3b
  memory.budget.fraction:
  - 0.05
