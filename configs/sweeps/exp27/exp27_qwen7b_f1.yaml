# Experiment 27 (§27, pre-registered; NOT YET APPROVED for spend), reader qwen2.5-7b-instruct, LongMemEval fold 1.
# The §23 Qwen 7B config with the cache directory changed: FIFO + floor and fixed8 (rerun in the same session for
# pairing) beside the two LRE arms. LRE's model for this fold was trained on the other four folds only
# (python -m memctl.lre_train --fold 1). Answers only (stub judge); one blind Qwen 7B judge pass follows.
name: exp27_qwen7b_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_exp27_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f1_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: lre
    label: lre_native
    model: configs/sweeps/exp27/lre/lre_f1.json
    mode: native
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: lre
    label: lre_slot
    model: configs/sweeps/exp27/lre/lre_f1.json
    mode: slot
    retrieval_method: lexical
    retrieve_candidates: 32
    select_k: 8
  memory.budget.fraction:
  - 0.05
