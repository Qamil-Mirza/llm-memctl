# Experiment 20 gate (§20, pre-registered; approved by the user on 2026-10-08, about $0.20-0.30), LongMemEval fold 4.
# The reader does not answer here: a stub builds and logs the prompt; only the note writer (the frozen reader,
# LLMConsolidator prompt, 100-token notes) calls the model. Head A, 32 BM25 candidates.
name: exp20_gate_f4
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 4
      part: test
    judge:
      backend: stub
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    log_prompt: true
    model:
      backend: stub
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - CONSOLIDATE
    - EVICT
    - NO_OP
    embedder: hashing
    count_labels: true
    consolidator: llm
    compression_model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/notes_qwen7b_exp20
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f4_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: fixed8_sum
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f4_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    notes:
      mode: groups
      ranks:
      - - 9
        - 16
      - - 17
        - 24
      - - 25
        - 32
      max_tokens: 100
  - name: rl
    label: fixed8_sess
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f4_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    notes:
      mode: sessions
      ranks:
      - 9
      - 32
      max_notes: 3
      max_tokens: 100
  - name: rl
    label: sum16
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f4_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 0
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
    notes:
      mode: groups
      ranks:
      - - 1
        - 8
      - - 9
        - 16
      max_tokens: 100
  - name: rl
    label: fixed16
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f4_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 16
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  memory.budget.fraction:
  - 0.05
