# Experiment 30 (§30, pre-registered, NOT APPROVED for spend), UtilMem eval side, shard 1 of 5, 100 questions, sample: 100 per domain from the 80 evaluation bundles, seed 30.
# Arms: FIFO + floor, fixed8, fixed16 (the §19 head, trained on LongMemEval only, zero-shot).
name: exp30_eval_qwen7b_s1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: utilmem
    path: external/UtilMem-hf/multi_domain_eval_strong.json
    part: eval
    shard:
      k: 5
      index: 1
    max_turn_tokens: 1000
    sample:
      seed: 30
      per_domain: 100
  agent:
    name: llm
    reasoning: false
    labels: compact
    max_new_tokens: 512
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 600
      cache_dir: cache/generations_exp30_eval_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  hindsight:
    enabled: false
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: fixed16
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 16
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  memory.budget.fraction:
  - 0.05
