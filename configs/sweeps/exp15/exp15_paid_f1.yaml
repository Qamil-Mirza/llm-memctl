# Experiment 15 paid run, LongMemEval fold 1: the frozen reader of Experiment 13 (7b5fc30 prompt, official judge),
# three head arms and keep-last-0 + top 5. Approved by the user on 2026-10-07 (about $0.30-0.40).
name: exp15_paid_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
    judge:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: archive_everything
    label: keep_last0_top5
    keep_last: 0
    retrieve:
      top_k: 5
      method: lexical
  - name: rl
    label: head_listwise
    checkpoint: runs/lme_head_listwise_f1/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 5
    retrieve_candidates: 16
    floor_head: true
    keep_none: true
  - name: rl
    label: head_listsum
    checkpoint: runs/lme_head_listsum_f1/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 5
    retrieve_candidates: 16
    floor_head: true
    keep_none: true
  - name: rl
    label: head_residual
    checkpoint: runs/lme_head_residual_f1/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 5
    retrieve_candidates: 16
    floor_head: true
    keep_none: true
    residual: 20.0
  memory.budget.fraction:
  - 0.05
