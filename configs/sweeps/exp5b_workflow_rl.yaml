# Experiment 5b: learned controllers on the sequential task, delete-only.
# rl_bc_transfer was trained on the recall task and has never seen this one (hypothesis H7).
name: exp5b_workflow_rl
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: workflow}
  agent: {name: scripted_tool_agent, noise: 0.0}
  memory:
    allowed_operations: [KEEP, EVICT, NO_OP]
    embedder: hashing
  shadow_controllers: [{name: fifo}, {name: salience}]
  logging: {detail_episodes: 1}
grid:
  controller:
    - fifo
    - lru
    - salience
    - {name: rl, label: rl_bc_transfer, checkpoint: runs/rl_bc/checkpoints/policy.pt}
    - {name: rl, label: rl_bc_workflow, checkpoint: runs/rl_bc_workflow/checkpoints/policy.pt}
    - {name: rl, label: rl_ppo_workflow, checkpoint: runs/rl_ppo_workflow/checkpoints/policy_best.pt}
    - {name: rl, label: rl_ppo_workflow_gamma0, checkpoint: runs/rl_ppo_workflow_gamma0/checkpoints/policy_best.pt}
    - {name: oracle, method: approx}
    - {name: oracle, method: approx, eager: false, label: oracle_approx_lazy}
  memory.budget.fraction: [0.05, 0.1, 0.2, 0.4]
