# Experiment 25 (§25, pre-registered, NOT YET APPROVED for spend), reader qwen2.5-7b-instruct, shard 0 of 7: participant-days [('A5_KATRINA', 'DAY1'), ('A6_SHURE', 'DAY5'), ('A6_SHURE', 'DAY7')].
# StreamMemBench (English), A3-A6 only, 200 evidence segments sampled with seed 25. The user simulator is Qwen2.5-7B on the same pod.
name: exp25_qwen7b_s0
base:
  schema_version: 1
  seed: 0
  episodes: 3
  env:
    name: streammembench
    path: data/streammembench/streammembench_v1_en
    sample:
      seed: 25
      items: 200
    shard:
      k: 7
      index: 0
    chunk_tokens: 150
    simulator:
      style: llm
      max_new_tokens: 512
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/simulator_exp25
  agent:
    name: llm
    reasoning: false
    labels: compact
    max_new_tokens: 320
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_exp25_qwen7b
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
    count_labels: true
  hindsight:
    enabled: false
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: fixed8
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 8
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  - name: rl
    label: fixed16
    checkpoint: /home/qamil-mirza/Code/llm-memctl/runs/lme_n4_head_f0_a/checkpoints/policy_best.pt
    retrieval_method: lexical
    retrieve_floor: 16
    retrieve_candidates: 32
    floor_head: true
    keep_none: true
  memory.budget.fraction:
  - 0.05
