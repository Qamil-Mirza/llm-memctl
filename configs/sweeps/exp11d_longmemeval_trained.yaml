# Experiment 11d: controllers trained on LongMemEval-S questions 100-499 (configs/rl/lme/), tested
# on the held-out questions 0-99 exactly as in Experiment 11c. Final checkpoints (policy.pt): their
# validation used a null task model, so policy_best.pt carries no signal.
# Experiment 11c: LongMemEval-S question answering with Qwen2.5-7B as the reader and as the judge (the
# local F1 is logged too). One episode per question (the first 100 of 500; about 115k history tokens each). Learned policies were trained only on
# the synthetic recall task: this is a transfer test. A judge from the same model as the reader may be
# lenient on its own phrasing; F1 is the check.
name: exp11d_longmemeval_trained
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: longmemeval, path: data/longmemeval/longmemeval_s_cleaned.json, judge: {backend: openai, name: "qwen2.5-7b-instruct", base_url: "https://1zb0pczeible1v-8000.proxy.runpod.net/v1", timeout_s: 300, cache_dir: cache/generations_qwen7b_vllm}}
  agent:
    name: llm
    max_new_tokens: 32
    model: {backend: openai, name: "qwen2.5-7b-instruct", base_url: "https://1zb0pczeible1v-8000.proxy.runpod.net/v1", timeout_s: 300, cache_dir: cache/generations_qwen7b_vllm}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 1}
grid:
  controller:
    - {name: rl, label: lme_bc_regret_s0, checkpoint: runs/lme_bc_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: lme_bc_regret_s1, checkpoint: runs/lme_bc_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: lme_bc_regret_s2, checkpoint: runs/lme_bc_regret_s2/checkpoints/policy.pt}
    - {name: rl, label: lme_bc_bridge_s0, bridge_search: true, checkpoint: runs/lme_bc_bridge_s0/checkpoints/policy.pt}
    - {name: rl, label: lme_bc_bridge_s1, bridge_search: true, checkpoint: runs/lme_bc_bridge_s1/checkpoints/policy.pt}
    - {name: rl, label: lme_bc_bridge_s2, bridge_search: true, checkpoint: runs/lme_bc_bridge_s2/checkpoints/policy.pt}
  memory.budget.fraction: [0.05, 0.1]
