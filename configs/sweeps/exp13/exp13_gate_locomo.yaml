# Evidence gate, LoCoMo categories 1-4: agent null, free; LongMemEval-trained = transfer.
name: exp13_gate_locomo
base:
  schema_version: 1
  seed: 0
  episodes: 10
  env:
    name: locomo
    include_adversarial: false
  agent:
    name: 'null'
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 0
grid:
  controller:
  - name: fifo
    label: fifo_top5
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: fusion
      model: BAAI/bge-small-en-v1.5
  - name: rl
    label: learned_floor5
    checkpoint: runs/lme_floor_f0_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: fusion
    retrieval_model: BAAI/bge-small-en-v1.5
  - name: rl
    label: compose_floor5
    checkpoint: runs/lme_compose4_f0_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: fusion
    retrieval_model: BAAI/bge-small-en-v1.5
  - name: rl
    label: synthetic_floor5
    checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: fusion
    retrieval_model: BAAI/bge-small-en-v1.5
  memory.budget.fraction:
  - 0.05
  - 0.1
  - 0.25
