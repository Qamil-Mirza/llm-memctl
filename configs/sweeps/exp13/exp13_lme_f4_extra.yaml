# LongMemEval fold 4: further learned rows, run only where the gate passes.
name: exp13_lme_f4_extra
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 4
      part: test
    judge:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: rl
    label: compose_floor5
    checkpoint: runs/lme_compose4_f4_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
  - name: rl
    label: compose_floor5_t2000
    checkpoint: runs/lme_compose4_f4_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 2000
  - name: rl
    label: compose_floor5_t3000
    checkpoint: runs/lme_compose4_f4_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 3000
  - name: rl
    label: compose_floor5_t4000
    checkpoint: runs/lme_compose4_f4_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 4000
  - name: rl
    label: synthetic_floor5_t2000
    checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 2000
  - name: rl
    label: synthetic_floor5_t3000
    checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 3000
  - name: rl
    label: synthetic_floor5_t4000
    checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 4000
  memory.budget.fraction:
  - 0.01
  - 0.02
  - 0.05
