# LongMemEval fold 2: matched token targets (2% and 5% only).
name: exp13_lme_f2_target
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 2
      part: test
    judge:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
      style: longmemeval
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 160
    model:
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: fifo
    label: fifo_top5_t2000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 2000
  - name: rl
    label: learned_floor5_t2000
    checkpoint: runs/lme_floor_f2_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 2000
  - name: fifo
    label: fifo_top5_t3000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 3000
  - name: rl
    label: learned_floor5_t3000
    checkpoint: runs/lme_floor_f2_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 3000
  - name: fifo
    label: fifo_top5_t4000
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
    target_tokens: 4000
  - name: rl
    label: learned_floor5_t4000
    checkpoint: runs/lme_floor_f2_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
    target_tokens: 4000
  memory.budget.fraction:
  - 0.02
  - 0.05
