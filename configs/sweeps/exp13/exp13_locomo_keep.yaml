# LoCoMo keep-last-n with the fusion top 5 (budget-free).
name: exp13_locomo_keep
base:
  schema_version: 1
  seed: 0
  episodes: 10
  env:
    name: locomo
    include_adversarial: false
    judge: &id001
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 160
    model: *id001
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: archive_everything
    label: keep_last0_top5
    keep_last: 0
    retrieve:
      top_k: 5
      method: fusion
      model: BAAI/bge-small-en-v1.5
  - name: archive_everything
    label: keep_last4_top5
    keep_last: 4
    retrieve:
      top_k: 5
      method: fusion
      model: BAAI/bge-small-en-v1.5
  - name: archive_everything
    label: keep_last16_top5
    keep_last: 16
    retrieve:
      top_k: 5
      method: fusion
      model: BAAI/bge-small-en-v1.5
  memory.budget.fraction:
  - 0.1
