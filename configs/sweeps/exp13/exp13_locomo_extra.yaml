# LoCoMo: the composed-episode LongMemEval policy (transfer), only where the LoCoMo gate passes.
name: exp13_locomo_extra
base:
  schema_version: 1
  seed: 0
  episodes: 10
  env:
    name: locomo
    include_adversarial: false
    judge: &id001
      backend: openai
      name: qwen2.5-7b-instruct
      base_url: POD_URL/v1
      timeout_s: 300
      cache_dir: cache/generations_qwen7b_vllm_v2
  agent:
    name: llm
    reasoning: true
    labels: compact
    max_new_tokens: 256
    model: *id001
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 100000
grid:
  controller:
  - name: rl
    label: compose_floor5_lme_f0
    checkpoint: runs/lme_compose4_f0_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: fusion
    retrieval_model: BAAI/bge-small-en-v1.5
  memory.budget.fraction:
  - 0.05
  - 0.1
  - 0.25
