# Evidence gate, LongMemEval fold 1: agent null, free.
name: exp13_gate_f1
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env:
    name: longmemeval
    path: data/longmemeval/longmemeval_s_cleaned.json
    folds:
      k: 5
      fold: 1
      part: test
  agent:
    name: 'null'
  memory:
    allowed_operations:
    - KEEP
    - MOVE_TO_ARCHIVE
    - RETRIEVE_FROM_ARCHIVE
    - NO_OP
    embedder: hashing
  logging:
    detail_episodes: 0
grid:
  controller:
  - name: fifo
    label: fifo_top5
    removal:
    - MOVE_TO_ARCHIVE
    retrieve:
      top_k: 5
      fit: true
      method: lexical
  - name: rl
    label: learned_floor5
    checkpoint: runs/lme_floor_f1_s0/checkpoints/policy_best.pt
    retrieve_floor: 5
    retrieve_candidates: 16
    retrieval_method: lexical
