# Experiment 11b, full-context baseline: whole conversations reach ~40k tokens with speaker and
# date labels, past 11b's 32k server. Served with YaRN (rope factor 2, max len 65,536), the
# setting Qwen documents for long inputs; separate cache so these generations stay distinct.
# Experiment 11b: LoCoMo question answering with Qwen2.5-7B as the reader and as the judge (the
# local F1 is logged too). One episode per conversation (10). Learned policies were trained only on
# the synthetic recall task: this is a transfer test. A judge from the same model as the reader may be
# lenient on its own phrasing; F1 is the check.
name: exp11b_locomo_full_context
base:
  schema_version: 1
  seed: 0
  episodes: 10
  env: {name: locomo, judge: {backend: openai, name: "qwen2.5-7b-instruct", base_url: "https://1zb0pczeible1v-8000.proxy.runpod.net/v1", timeout_s: 300, cache_dir: cache/generations_qwen7b_vllm_yarn64k}}
  agent:
    name: llm
    max_new_tokens: 32
    model: {backend: openai, name: "qwen2.5-7b-instruct", base_url: "https://1zb0pczeible1v-8000.proxy.runpod.net/v1", timeout_s: 300, cache_dir: cache/generations_qwen7b_vllm_yarn64k}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 1}
grid:
  controller:
    - {name: full_context}
  memory.budget.fraction: [1.0]
