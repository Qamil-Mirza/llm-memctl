# D2b on the workflow task with archive and retrieval allowed (the same operations as the recall task).
name: d2b_same_ops_workflow_eval
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: workflow}
  agent: {name: scripted_tool_agent, noise: 0.0}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 0}
grid:
  controller:
    - fifo
    - {name: fifo, label: fifo_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: salience, label: salience_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - salience
    - {name: oracle, method: approx, eager: false, label: oracle_approx_lazy}
    - {name: oracle, method: approx, label: oracle_approx_archive}
    - {name: rl, label: workflow_specialist, checkpoint: runs/rl_bc_workflow/checkpoints/policy.pt}
    - {name: rl, label: recall_specialist_s0, checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: joint_same_ops_s0, checkpoint: runs/joint_same_ops_s0/checkpoints/policy.pt}
    - {name: rl, label: recall_specialist_s1, checkpoint: runs/rl_bc_archive_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: joint_same_ops_s1, checkpoint: runs/joint_same_ops_s1/checkpoints/policy.pt}
    - {name: rl, label: recall_specialist_s2, checkpoint: runs/rl_bc_archive_regret_s2/checkpoints/policy.pt}
    - {name: rl, label: joint_same_ops_s2, checkpoint: runs/joint_same_ops_s2/checkpoints/policy.pt}
  memory.budget.fraction: [0.05, 0.1, 0.2, 0.4]
