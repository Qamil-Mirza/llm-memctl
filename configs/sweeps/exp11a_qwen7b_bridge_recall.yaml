# Experiment 11a: the follow-the-clue policies (Experiment 10) with Qwen2.5-7B as the reader, on
# Experiment 9's seeds and prompt. Cells shared with Experiment 9 hit the same generation cache.
# vLLM v0.8.5, Qwen2.5-7B-Instruct bf16, 32,768-token context, RunPod A40; set base_url to your server.
name: exp11a_qwen7b_bridge_recall
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: synthetic_recall, horizon: 200}
  agent:
    name: llm
    max_new_tokens: 12
    instructions: >-
      You are given your memory and a question. Facts are stated as "As of step N, the X of Y is Z".
      If a fact is stated more than once, the statement with the largest step number is current.
      Reply with only the value Z (for example K93Q), or the single word unknown if the memory
      does not contain it.
    model: {backend: openai, name: "qwen2.5-7b-instruct", base_url: "https://1zb0pczeible1v-8000.proxy.runpod.net/v1", timeout_s: 300, cache_dir: cache/generations_qwen7b_vllm}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 2}
grid:
  controller:
    - {name: fifo, label: fifo_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: oracle, method: approx}
    - {name: rl, label: bc_regret_s0, checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: bc_regret_s1, checkpoint: runs/rl_bc_archive_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: bc_regret_s2, checkpoint: runs/rl_bc_archive_regret_s2/checkpoints/policy.pt}
    - {name: rl, label: bc_bridge_s0, bridge_search: true, checkpoint: runs/rl_bc_bridge_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: bc_bridge_s1, bridge_search: true, checkpoint: runs/rl_bc_bridge_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: bc_bridge_s2, bridge_search: true, checkpoint: runs/rl_bc_bridge_regret_s2/checkpoints/policy.pt}
  memory.budget.fraction: [0.02, 0.05, 0.1, 0.25]
