# D2 on the recall task: one policy trained on both tasks against the recall specialist (D1).
# Run from the D2 worktree with the D1 specialists copied into its runs/.
name: d2_joint_recall_eval
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: synthetic_recall, horizon: 200}
  agent: {name: scripted_reader, noise: 0.0}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 0}
grid:
  controller:
    - {name: fifo, label: fifo_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: salience, label: salience_archive_retrieve, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 3}}
    - {name: oracle, method: approx}
    - {name: rl, label: specialist_s0, checkpoint: runs/rl_bc_archive_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: joint_bc_s0, checkpoint: runs/joint_bc_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: joint_cost_s0, checkpoint: runs/joint_cost_regret_s0/checkpoints/policy.pt}
    - {name: rl, label: specialist_s1, checkpoint: runs/rl_bc_archive_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: joint_bc_s1, checkpoint: runs/joint_bc_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: joint_cost_s1, checkpoint: runs/joint_cost_regret_s1/checkpoints/policy.pt}
    - {name: rl, label: specialist_s2, checkpoint: runs/rl_bc_archive_regret_s2/checkpoints/policy.pt}
    - {name: rl, label: joint_bc_s2, checkpoint: runs/joint_bc_regret_s2/checkpoints/policy.pt}
    - {name: rl, label: joint_cost_s2, checkpoint: runs/joint_cost_regret_s2/checkpoints/policy.pt}
  memory.budget.fraction: [0.02, 0.05, 0.1, 0.25]
