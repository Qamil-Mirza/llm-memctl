# Experiment 6b: evidence retention on LongMemEval-S (about 115k tokens of history per question),
# with no task model. As in 6a, task success is 0 by construction; read the evidence metrics.
# Each worker loads the 277 MB data file, so keep --workers small.
#   python -m memctl.sweep --config configs/sweeps/exp6_longmemeval_retention.yaml --workers 4
name: exp6_longmemeval_retention
base:
  schema_version: 1
  seed: 0
  episodes: 100
  env: {name: longmemeval, path: data/longmemeval/longmemeval_s_cleaned.json}
  agent: {name: "null"}
  memory:
    allowed_operations: [KEEP, EVICT, MOVE_TO_ARCHIVE, RETRIEVE_FROM_ARCHIVE, NO_OP]
    embedder: hashing
  logging: {detail_episodes: 1}
grid:
  controller:
    - {name: fifo, label: fifo_delete}
    - {name: random, label: random_delete}
    - {name: salience, label: salience_delete}
    - {name: fifo, label: fifo_archive_retrieve_lexical, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 5}}
    - {name: fifo, label: fifo_archive_retrieve_embedding, removal: [MOVE_TO_ARCHIVE], retrieve: {top_k: 5, method: embedding}}
    - {name: oracle, method: approx}
  memory.budget.fraction: [0.05, 0.1, 0.25]
