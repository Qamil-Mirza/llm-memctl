# Smoke test: tiny synthetic benchmark, no model download. Not a thesis result.
benchmark:
  name: synthetic
  conversations: 2
budget:
  fraction: 0.25        # B as a fraction of the full history (or use "tokens: 300")
memory:
  allow_drop: true
  recall_cost_tokens: 50
  store_top_k: 5
  charge_archive_index: true
  embedder: hashing
controller:
  name: full_context
model:
  backend: stub
  name: Qwen/Qwen3.5-4B   # used from Phase 2 on; the stub backend ignores it
  max_new_tokens: 64
  temperature: 0.0
  cache_dir: cache/generations
seed: 0
output_dir: runs
