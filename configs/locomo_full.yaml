# The full LoCoMo experiment: all 10 conversations, all 1,986 questions, 16-bit weights.
#
# This is the config for the thesis result. It needs a GPU of about 12 GB or more:
# Qwen3.5-4B is 8.41 GB at 16-bit and full_context prompts reach about 22,000 model
# tokens. See docs/porting.md section 4. On a smaller card nothing here will run;
# configs/locomo_small_4bit.yaml is the small-card fallback, and its numbers are not
# comparable with these (docs/decisions.md entries 39 and 41).
#
# The budget is set per run on the command line, so one config covers the whole grid:
#   python -m memctl.run --config configs/locomo_full.yaml --controller oracle --budget-fraction 0.10
# scripts/run_grid.sh drives the whole thing. full_context ignores the budget and is
# run once (docs/decisions.md entry 43).
#
# No `limit` and no `questions_per_conversation`: every conversation and every question.
# 1,986 questions in total, of which 446 are adversarial and 1,540 are not.
benchmark:
  name: locomo
  path: data/locomo/locomo10.json
budget:
  fraction: 0.25                 # overridden per run by --budget-fraction
memory:
  allow_drop: true
  recall_cost_tokens: 50
  store_top_k: 10
  charge_archive_index: true
  max_recall_rounds: 2
  embedder: BAAI/bge-small-en-v1.5
  # embedder_device is left unset, so the embedder uses the GPU as it did on the Mac.
  # Only set it to cpu on a card too small to hold the answerer and the embedder at once.
controller:
  name: keep_newest              # overridden per run by --controller
model:
  backend: hf                    # hf | vllm | stub
  name: Qwen/Qwen3.5-4B
  max_new_tokens: 48
  cache_dir: cache/generations
  # load_in_4bit is deliberately absent: these runs are 16-bit, like the Mac's.
judge:
  backend: hf
  name: Qwen/Qwen3.5-2B
  cache_dir: cache/judge
seed: 0
output_dir: runs/locomo_full
