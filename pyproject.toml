[project]
name = "memctl"
version = "0.1.0"
description = "Mechanistic investigation of evidence-use failures in small language models (honors thesis)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
stats = ["scikit-learn>=1.3", "scipy"]
models = ["torch>=2.3", "transformers>=5.0", "accelerate", "sentence-transformers"]  # for the hf backend

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
