[project]
name = "memctl"
version = "0.1.0"
description = "A swappable memory controller for LLM agents (honors thesis codebase)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "pulp>=2.9,<4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
models = ["torch>=2.3", "transformers>=5.0", "accelerate", "sentence-transformers"]  # for the hf backend
quantized = ["bitsandbytes>=0.48"]  # only for model.load_in_4bit on a small GPU
# Added in Phase 3: jev (typesafe-sdk).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pulp", "ignore:.*PULP_CBC_CMD.*"]
