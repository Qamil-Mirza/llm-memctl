# Usage (see docs/porting.md):
#   docker compose run --rm memctl                                   # run the tests
#   docker compose run --rm memctl python -m memctl.run --config configs/locomo_small.yaml
#
# On a machine without an NVIDIA GPU, use the "cpu" service instead of "memctl".
x-memctl: &memctl
  build: .
  image: memctl:latest
  # Run as the host user, so runs/, cache/ and data/ do not come back owned by root.
  # .env sets MEMCTL_UID and MEMCTL_GID; 1000:1000 is the usual first user on Linux.
  user: "${MEMCTL_UID:-1000}:${MEMCTL_GID:-1000}"
  env_file:
    - path: .env          # JEV_API_KEY, HF_TOKEN, MEMCTL_UID, MEMCTL_GID; never committed
      required: false
  volumes:
    - .:/app                    # the project folder: code, configs, runs/, cache/, data/
    - models:/models            # downloaded model weights

services:
  memctl:
    <<: *memctl
    environment:
      # This matters on small cards: without it a few free megabytes can be unusable.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HOME: /tmp          # the numeric user has no /etc/passwd entry and so no home
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cpu:
    <<: *memctl
    profiles: ["cpu"]
    environment:
      HOME: /tmp

volumes:
  models:
